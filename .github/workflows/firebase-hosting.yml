name: Deploy BARNAGUER web to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.webp"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BARNAGUER_66C1D }}
          projectId: barnaguer-66c1d
          channelId: live
