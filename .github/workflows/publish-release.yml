name: Publish BARNAGUER v1.1.0
on:
  push:
    branches:
      - feature/offline-complete
    paths:
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify signing secrets
        env:
          KEYSTORE: ${{ secrets.BARNAGUER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BARNAGUER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BARNAGUER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BARNAGUER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.BARNAGUER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 --decode > android/release-key.p12
          test -s android/release-key.p12
      - name: Build signed release APK
        env:
          BARNAGUER_KEYSTORE_PATH: ../release-key.p12
          BARNAGUER_KEYSTORE_PASSWORD: ${{ secrets.BARNAGUER_KEYSTORE_PASSWORD }}
          BARNAGUER_KEY_ALIAS: ${{ secrets.BARNAGUER_KEY_ALIAS }}
          BARNAGUER_KEY_PASSWORD: ${{ secrets.BARNAGUER_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 android/app/build/outputs/apk/release/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "BARNAGUER v1.1.0" \
            --notes "Nueva versión de BARNAGUER con modo offline completo, almacenamiento local de solicitudes pendientes y sincronización con Supabase al recuperar conexión. Las solicitudes offline permanecen pendientes hasta que el servidor confirme su disponibilidad."
      - name: Remove signing key
        if: always()
        run: rm -f android/release-key.p12
